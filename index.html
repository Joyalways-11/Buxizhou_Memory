<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#12110f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="不系舟" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>不系舟</title>
    <link rel="icon" href="./icon.svg?v=2.2" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=2.2" />
    <link rel="manifest" href="./manifest.webmanifest?v=2.2" />
    <link rel="stylesheet" href="./styles.css?v=2.2" />
  </head>
  <body>
    <main class="app-shell">
      <section class="lockscreen" aria-label="不系舟今日首页">
        <div class="lockscreen-bg" id="photoBackdrop" aria-hidden="true"></div>

        <header class="lockbar">
          <div class="brand-lockup" aria-label="不系舟">
            <span class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 48 48" role="img">
                <path class="mark-hull" d="M9 29.5c8.2 8.4 21.8 8.4 30 0-1.9 8.5-8.1 13-15 13s-13.1-4.5-15-13Z" />
                <path class="mark-sail" d="M18.2 27.4c4.4-8.8 10.6-15.3 18.5-19.2-.8 8.3-3.7 15.4-8.5 21.2-3.7.4-7-.3-10-2Z" />
                <path class="mark-wave" d="M15.5 28.8c5.9-2.2 12-2.3 18.3-.3" />
              </svg>
            </span>
            <h1>不系舟</h1>
          </div>
          <div class="clock-face" aria-label="当前时间">
            <p class="time-line" id="timeText"></p>
            <p class="date-line" id="todayText"></p>
          </div>
          <span class="lockbar-spacer" aria-hidden="true"></span>
        </header>

        <section class="home-stack" aria-label="今日灵感和记录">
          <article class="glass-notice spark-notice">
            <div class="notice-icon notice-icon-spark" aria-hidden="true">S</div>
            <div>
              <div class="notice-meta">
                <span>SPARK</span>
                <span>现在</span>
              </div>
              <p class="quote-text" id="quoteText"></p>
              <p class="quote-source" id="quoteSource"></p>
            </div>
          </article>

          <a class="glass-notice music-notice" id="musicLink" target="_blank" rel="noreferrer" aria-label="打开音乐搜索">
            <div class="notice-icon notice-icon-music" aria-hidden="true">♪</div>
            <div>
              <div class="notice-meta">
                <span>音乐</span>
                <span>推荐</span>
              </div>
              <h2 id="musicTitle"></h2>
              <p id="musicArtist"></p>
            </div>
          </a>

          <article class="panel capture-panel" aria-labelledby="captureTitle">
            <div class="section-heading">
              <h2 id="captureTitle">快速记录</h2>
              <span id="saveStatus" role="status" aria-live="polite"></span>
            </div>
            <textarea id="noteInput" rows="3" placeholder="写下刚刚经过你的东西" aria-label="快速记录内容"></textarea>
            <button class="primary-button" id="saveNoteButton" type="button">保存</button>
          </article>
        </section>

      </section>

      <section class="content-stack" aria-label="记录和 Todo">
        <section class="panel memory-panel hidden" id="memoryPanel" aria-labelledby="memoryTitle">
          <div class="section-heading">
            <h2 id="memoryTitle">往年的今天</h2>
          </div>
          <div id="memoryList" class="note-list"></div>
        </section>

        <section class="panel recent-panel" aria-labelledby="recentTitle">
          <div class="section-heading">
            <h2 id="recentTitle">最近记录</h2>
          </div>
          <div id="recentNotes" class="note-list empty-state">还没有记录。</div>
        </section>

        <article class="panel todo-panel" aria-label="今日 Todo">
          <div class="section-heading">
            <h2>今日 Todo</h2>
          </div>
          <form class="todo-form" data-scope="today">
            <input name="title" type="text" placeholder="添加今日任务" autocomplete="off" aria-label="今日任务内容" />
            <input name="due" type="datetime-local" aria-label="今日任务截止时间" />
            <button class="small-button" type="submit">添加</button>
          </form>
          <div class="todo-list" id="todayTodos"></div>
        </article>

        <article class="panel todo-panel" aria-label="本周 Todo">
          <div class="section-heading">
            <h2>本周 Todo</h2>
          </div>
          <form class="todo-form" data-scope="week">
            <input name="title" type="text" placeholder="添加本周任务" autocomplete="off" aria-label="本周任务内容" />
            <input name="due" type="datetime-local" aria-label="本周任务截止时间" />
            <button class="small-button" type="submit">添加</button>
          </form>
          <div class="todo-list" id="weekTodos"></div>
        </article>

        <section class="panel backup-panel" aria-labelledby="backupTitle">
          <div class="section-heading">
            <h2 id="backupTitle">备份</h2>
            <span id="backupStatus" role="status" aria-live="polite"></span>
          </div>
          <div class="backup-actions">
            <button class="secondary-button export-wide" id="exportButtonFooter" type="button">导出备份</button>
            <button class="secondary-button" id="importButton" type="button">导入备份</button>
            <input class="visually-hidden" id="importFile" type="file" accept="application/json" />
            <button class="secondary-button" id="clearDoneButton" type="button">清理已完成</button>
          </div>
        </section>

        <div class="photo-credit">
          <span id="photoSource"></span>
          <span id="photoTitle"></span>
        </div>
      </section>
    </main>

    <script src="./app.js?v=2.2"></script>
  </body>
</html>
