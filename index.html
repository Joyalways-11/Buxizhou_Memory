<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#12110f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="不系舟" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>不系舟</title>
    <link rel="icon" href="./icon-192.png?v=3.2" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=3.2" />
    <link rel="manifest" href="./manifest.webmanifest?v=3.2" />
    <link rel="stylesheet" href="./styles.css?v=3.2" />
  </head>
  <body>
    <main class="app-shell">
      <section class="lockscreen" aria-label="不系舟今日首页">
        <div class="lockscreen-bg" id="photoBackdrop" aria-hidden="true"></div>

        <header class="lockbar">
          <div class="brand-lockup" aria-label="不系舟">
            <span class="brand-mark" aria-hidden="true">
              <img src="./icon-192.png?v=3.2" alt="" />
            </span>
            <h1>不系舟</h1>
          </div>
          <div class="clock-face" aria-label="当前时间">
            <p class="time-line" id="timeText"></p>
            <p class="date-line" id="todayText"></p>
          </div>
          <span class="lockbar-spacer" aria-hidden="true"></span>
        </header>

        <section class="home-stack" aria-label="今日灵感和记录">
          <article class="glass-notice spark-notice">
            <div class="notice-icon notice-icon-spark" aria-hidden="true">S</div>
            <div>
              <div class="notice-meta">
                <span>SPARK</span>
                <span>现在</span>
              </div>
              <p class="quote-text" id="quoteText"></p>
              <p class="quote-source" id="quoteSource"></p>
            </div>
          </article>

          <article class="panel capture-panel" aria-labelledby="captureTitle">
            <div class="section-heading">
              <h2 id="captureTitle">快速记录</h2>
              <span id="saveStatus" role="status" aria-live="polite"></span>
            </div>
            <textarea id="noteInput" rows="3" placeholder="写下刚刚经过你的东西" aria-label="快速记录内容"></textarea>
            <div class="photo-preview hidden" id="photoPreview">
              <img id="photoPreviewImage" alt="待保存照片预览" />
              <button class="photo-remove-button" id="removePhotoButton" type="button">移除照片</button>
            </div>
            <div class="capture-actions">
              <button class="secondary-button" id="addPhotoButton" type="button">添加照片</button>
              <input class="visually-hidden" id="photoInput" type="file" accept="image/*" />
              <button class="primary-button" id="saveNoteButton" type="button">保存</button>
            </div>
          </article>
        </section>

      </section>

      <section class="content-stack" aria-label="记录和 Todo">
        <section class="panel memory-panel hidden" id="memoryPanel" aria-labelledby="memoryTitle">
          <div class="section-heading">
            <h2 id="memoryTitle">往年的今天</h2>
          </div>
          <div id="memoryList" class="note-list"></div>
        </section>

        <section class="panel recent-panel" aria-labelledby="recentTitle">
          <div class="section-heading">
            <h2 id="recentTitle">最近记录</h2>
            <button class="text-toggle-button" id="recentToggleButton" type="button" aria-expanded="true">收起</button>
          </div>
          <p class="recent-summary hidden" id="recentSummary"></p>
          <div id="recentNotes" class="note-list empty-state">还没有记录。</div>
        </section>

        <article class="panel todo-panel" aria-label="今日 Todo">
          <div class="section-heading">
            <h2>今日 Todo</h2>
          </div>
          <form class="todo-form" data-scope="today">
            <input name="title" type="text" placeholder="添加今日任务" autocomplete="off" aria-label="今日任务内容" />
            <input class="todo-due-input" name="due" type="datetime-local" aria-label="今日任务截止时间" />
            <button class="small-button" type="submit">添加</button>
          </form>
          <div class="todo-list" id="todayTodos"></div>
        </article>

        <article class="panel todo-panel" aria-label="本周 Todo">
          <div class="section-heading">
            <h2>本周 Todo</h2>
          </div>
          <form class="todo-form" data-scope="week">
            <input name="title" type="text" placeholder="添加本周任务" autocomplete="off" aria-label="本周任务内容" />
            <input class="todo-due-input" name="due" type="datetime-local" aria-label="本周任务截止时间" />
            <button class="small-button" type="submit">添加</button>
          </form>
          <div class="todo-list" id="weekTodos"></div>
        </article>

        <section class="panel backup-panel" aria-labelledby="backupTitle">
          <div class="section-heading">
            <h2 id="backupTitle">备份</h2>
            <span id="backupStatus" role="status" aria-live="polite"></span>
          </div>
          <div class="backup-actions">
            <button class="secondary-button export-wide" id="exportButtonFooter" type="button">导出备份</button>
            <button class="secondary-button" id="importButton" type="button">导入备份</button>
            <input class="visually-hidden" id="importFile" type="file" accept="application/json" />
            <button class="secondary-button" id="clearDoneButton" type="button">清理已完成</button>
          </div>
          <p class="storage-status" id="storageStatus"></p>
        </section>

        <section class="panel cloud-panel" aria-labelledby="cloudTitle">
          <div class="section-heading">
            <h2 id="cloudTitle">云同步</h2>
            <span id="syncStatus" role="status" aria-live="polite"></span>
          </div>
          <div class="cloud-auth" id="cloudAuth">
            <input id="syncEmail" type="email" inputmode="email" autocomplete="email" placeholder="邮箱" aria-label="云同步邮箱" />
            <button class="secondary-button" id="sendLoginButton" type="button">发送登录邮件</button>
          </div>
          <div class="cloud-actions hidden" id="cloudActions">
            <button class="secondary-button export-wide" id="syncNowButton" type="button">立即同步</button>
            <button class="secondary-button" id="uploadLocalButton" type="button">上传本机记录</button>
            <button class="secondary-button" id="logoutButton" type="button">退出登录</button>
          </div>
          <p class="storage-status" id="cloudHelp"></p>
        </section>

        <div class="photo-credit">
          <span id="photoSource"></span>
          <span id="photoTitle"></span>
        </div>
      </section>

      <div class="confirm-layer hidden" id="deleteConfirmLayer" role="dialog" aria-modal="true" aria-labelledby="deleteConfirmTitle">
        <section class="confirm-card">
          <h2 id="deleteConfirmTitle">是否确认删除</h2>
          <p>这条记录会从最近记录里移除，并同步到云端。</p>
          <div class="confirm-actions">
            <button class="secondary-button" id="cancelDeleteButton" type="button">返回</button>
            <button class="danger-button" id="confirmDeleteButton" type="button">确认</button>
          </div>
        </section>
      </div>
    </main>

    <script src="./cloud-config.js?v=3.2"></script>
    <script src="./app.js?v=3.2"></script>
  </body>
</html>
